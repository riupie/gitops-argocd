---
apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: prometheus
  namespace: monitoring
spec:
  serviceMonitorSelector: 
    matchLabels:
      app.kubernetes.io/part-of: kube-prometheus-stack
      release: kube-prometheus-stack
  serviceMonitorNamespaceSelector: {}
  probeSelector: 
    matchLabels:
      app.kubernetes.io/part-of: kube-prometheus-stack
      release: kube-prometheus-stack
  probeNamespaceSelector: {}
  podMonitorSelector: 
    matchLabels:
      app.kubernetes.io/part-of: kube-prometheus-stack
      release: kube-prometheus-stack
  podMonitorNamespaceSelector: {}
  ruleSelector: 
    matchLabels:
      app.kubernetes.io/part-of: kube-prometheus-stack
      release: kube-prometheus-stack
  ruleNamespaceSelector: {}
  podMetadata:
    labels:
      env: development
      project: monitoring
  image: quay.io/prometheus/prometheus:v3.5.0
  imagePullPolicy: IfNotPresent
  replicas: 1
  retention: 1d
  logLevel: info
  walCompression: true
  storage:
    volumeClaimTemplate:
      spec:
        resources:
          requests:
            storage: 5Gi
  resources:
    requests:
      cpu: "100m"
      memory: 1Gi
    limits:
      memory: 1Gi
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
    runAsGroup: 65534
    fsGroup: 2000
  serviceAccountName: kube-prometheus-stack-operator
  externalLabels:
    environment: development
    cluster-id: lab-cluster
  enableAdminAPI: true
  disableCompaction: true